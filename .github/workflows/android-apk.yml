name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and pinned add-ons
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android export packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Set up Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare Godot add-ons
        run: bash tools/setup_addons.sh

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/machforge-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/machforge-debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export installable Android debug APK
        run: |
          ulimit -c 0
          adb start-server
          mkdir -p build
          if godot --headless --path . --export-debug "Android" build/MachForge.apk; then
            echo "Godot export command completed."
          else
            echo "Godot returned a shutdown error; validating the APK it produced."
          fi
          test -s build/MachForge.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose build/MachForge.apk

      - name: Export emulator-only build for visual verification
        run: |
          if godot --headless --path . --export-debug "Android Emulator" build/MachForge-emulator.apk; then
            echo "Godot emulator export command completed."
          else
            echo "Godot returned a shutdown error; validating the emulator APK it produced."
          fi
          test -s build/MachForge-emulator.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose build/MachForge-emulator.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and capture Android build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p build/emulator-diagnostics
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install build/MachForge-emulator.apk
            adb logcat -c
            adb shell monkey -p com.machforge.app 1 | tee build/emulator-diagnostics/monkey.txt
            sleep 12
            # Dismiss Android's first-run immersive-mode education overlay.
            adb shell input tap 1700 500
            sleep 2
            adb shell input tap 780 570
            sleep 4
            adb shell pidof com.machforge.app > build/emulator-diagnostics/app-pid.txt || true
            adb logcat -d -v time | grep -Ei 'Godot|AndroidRuntime|FATAL EXCEPTION|MachForge|GodotApp' > build/emulator-diagnostics/logcat.txt || true
            adb shell dumpsys activity activities | grep -Ei 'mResumedActivity|topResumedActivity|machforge|godot' > build/emulator-diagnostics/activity.txt || true
            test -s build/emulator-diagnostics/app-pid.txt
            adb shell screencap -p /sdcard/machforge-screen.png
            adb pull /sdcard/machforge-screen.png build/MachForge-emulator.png

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MachForge-Android-emulator-diagnostics
          path: build/emulator-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Upload emulator render capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MachForge-Android-emulator-capture
          path: build/MachForge-emulator.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact
        if: always()
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MachForge-Android-debug-APK
          path: build/MachForge.apk
          if-no-files-found: error
          retention-days: 30
