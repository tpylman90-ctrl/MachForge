name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and pinned add-ons
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android export packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Set up Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare Godot add-ons
        run: bash tools/setup_addons.sh

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/machforge-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/machforge-debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export installable Android debug APK
        run: |
          ulimit -c 0
          adb start-server
          mkdir -p build
          if godot --headless --path . --export-debug "Android" build/MachForge.apk; then
            echo "Godot export command completed."
          else
            echo "Godot returned a shutdown error; validating the APK it produced."
          fi
          test -s build/MachForge.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose build/MachForge.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachForge-Android-debug-APK
          path: build/MachForge.apk
          if-no-files-found: error
          retention-days: 30
